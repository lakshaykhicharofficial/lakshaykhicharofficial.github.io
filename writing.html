<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Writing — Lakshay Khichar</title>
<meta name="description" content="All posts by Lakshay Khichar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
<script>
  try {
    var saved = localStorage.getItem("theme");
    if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
  } catch (e) {}
</script>
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #000000;
    --muted: #6B6B6B;
    --line: #E8E8E8;
    --tile: #F3F3F3;
    --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --sans: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --ink: #FFFFFF; --muted: #9C9C9C; --line: #262626; --tile: #141414;
    }
  }
  :root[data-theme="dark"] { --bg: #000000; --ink: #FFFFFF; --muted: #9C9C9C; --line: #262626; --tile: #141414; }

  *, *::before, *::after { box-sizing: inherit; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 4.5rem); }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
    body, .topbar { transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease; }
  }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-weight: 400; font-size: 1.05rem; line-height: 1.75; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-underline-offset: 0.3em; text-decoration-thickness: 1px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }

  .wrap-wide { width: 100%; max-width: 66rem; margin: 0 auto; padding: 0 1.5rem; }

  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  .topbar-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.25rem 1rem; min-height: 3.75rem; padding-top: 0.5rem; padding-bottom: 0.5rem; }
  .brand { font-family: var(--serif); font-weight: 500; font-size: 1.3rem; text-decoration: none; }
  .nav-right { display: flex; align-items: center; gap: 1.5rem; }
  .menu { display: flex; gap: 1.5rem; margin: 0; padding: 0; list-style: none; }
  .menu a { color: var(--muted); text-decoration: none; font-size: 0.95rem; }
  .menu a:hover { color: var(--ink); text-decoration: underline; }
  .theme { display: grid; place-items: center; width: 2.25rem; height: 2.25rem; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--ink); cursor: pointer; flex: none; }
  .theme:hover { border-color: var(--ink); }
  .theme svg { width: 1.05rem; height: 1.05rem; }
  @media (max-width: 560px) {
    .brand { display: none; }
    .topbar-inner { justify-content: center; }
    .nav-right { width: 100%; justify-content: space-between; gap: 0.6rem; }
    .menu { gap: 0.7rem; }
    .menu a { font-size: 0.85rem; }
  }

  .subhead { padding: 6.5rem 0 3rem; }
  .subhead h1 { margin: 0 0 0.75rem; font-family: var(--serif); font-weight: 400; font-size: clamp(2.25rem, 6vw, 3.25rem); line-height: 1.1; }
  .lede { margin: 0; color: var(--muted); max-width: 52ch; }
  .back-link { display: inline-block; margin-bottom: 1.5rem; color: var(--muted); text-decoration: none; font-size: 0.9rem; }
  .back-link:hover { color: var(--ink); text-decoration: underline; }

  .post-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1.25rem; padding-bottom: 5rem; }
  .post-card { display: flex; flex-direction: column; aspect-ratio: 1 / 1; padding: 1.5rem; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); }
  .post-card:hover { border-color: var(--ink); }
  .post-card time { color: var(--muted); font-size: 0.85rem; }
  .post-card h3 { margin: 0.6rem 0 0.75rem; font-family: var(--serif); font-weight: 500; font-size: 1.5rem; line-height: 1.2; }
  .post-card p { margin: 0; color: var(--muted); font-size: 0.95rem; overflow: hidden; }
  .post-card .read-more { margin-top: auto; font-size: 0.85rem; text-decoration: underline; text-underline-offset: 0.25em; }
  .posts-empty { color: var(--muted); font-style: italic; }

  footer { padding: 2rem 0 3rem; color: var(--muted); font-size: 0.9rem; border-top: 1px solid var(--line); }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap-wide topbar-inner">
    <a class="brand" href="index.html">Lakshay Khichar</a>
    <div class="nav-right">
      <nav aria-label="Sections">
        <ul class="menu">
          <li><a href="index.html#about">About</a></li>
          <li><a href="writing.html">Writing</a></li>
          <li><a href="index.html#photos">Photos</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>
      <button class="theme" id="theme" type="button" aria-label="Switch to dark mode">
        <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="subhead">
    <div class="wrap-wide">
      <a class="back-link" href="index.html">← Home</a>
      <h1>Writing</h1>
      <p class="lede">Every post, most recent first.</p>
    </div>
  </section>

  <div class="wrap-wide">
    <div class="post-grid" id="post-grid">
      <p class="posts-empty">Posts will appear here once published from the admin panel.</p>
    </div>
  </div>
</main>

<footer>
  <div class="wrap-wide">&copy; 2026 Lakshay Khichar</div>
</footer>

<script>
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById("theme");
    var moon = document.getElementById("icon-moon");
    var sun = document.getElementById("icon-sun");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function isDark() { var t = root.getAttribute("data-theme"); return t ? t === "dark" : mq.matches; }
    function paint() {
      var dark = isDark();
      moon.style.display = dark ? "none" : "";
      sun.style.display = dark ? "" : "none";
      btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    }
    btn.addEventListener("click", function () {
      var next = isDark() ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
      paint();
    });
    if (mq.addEventListener) mq.addEventListener("change", paint);
    paint();
  })();

  function slugify(s) {
    return (s || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "post";
  }
  function withSlugs(posts) {
    var seen = {};
    return posts.map(function (p) {
      var base = slugify(p.title);
      var slug = base, n = 2;
      while (seen[slug]) { slug = base + "-" + (n++); }
      seen[slug] = true;
      p.slug = slug;
      return p;
    });
  }

  fetch("content/posts.json").then(function (r) { return r.json(); }).then(function (data) {
    var posts = (data.posts || []).filter(function (p) { return p.status === "published"; });
    posts.sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
    posts = withSlugs(posts);
    var grid = document.getElementById("post-grid");
    if (!posts.length) return; // keep the placeholder message
    grid.innerHTML = "";
    posts.forEach(function (p) {
      var a = document.createElement("a");
      a.className = "post-card";
      a.href = "post.html?slug=" + encodeURIComponent(p.slug);
      var d = p.date ? new Date(p.date) : null;
      var dateHtml = d ? '<time datetime="' + p.date + '">' + d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) + "</time>" : "";
      a.innerHTML = dateHtml + '<h3></h3><p></p><span class="read-more">Read post →</span>';
      a.querySelector("h3").textContent = p.title || "";
      a.querySelector("p").textContent = p.excerpt || "";
      grid.appendChild(a);
    });
  }).catch(function () { /* content/posts.json not reachable yet (e.g. inside this preview); placeholder stays */ });
</script>
</body>
</html>
