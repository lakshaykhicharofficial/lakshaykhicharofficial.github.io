  :root {
    --bg: #FFFFFF;

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000000; --ink: #FFFFFF; --muted: #9C9C9C; --line: #262626; }

  :root[data-theme="dark"] { --bg: #000000; --ink: #FFFFFF; --muted: #9C9C9C; --line: #262626; }

  *, *::before, *::after { box-sizing: inherit; }
  html { -webkit-text-size-adjust: 100%; }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
    body, .topbar { transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease; }
  }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-weight: 400; font-size: 1.05rem; line-height: 1.75; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-underline-offset: 0.3em; text-decoration-thickness: 1px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }

  .wrap { width: 100%; max-width: 42rem; margin: 0 auto; padding: 0 1.5rem; }
  .wrap-wide { width: 100%; max-width: 66rem; margin: 0 auto; padding: 0 1.5rem; }

  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  .topbar-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.25rem 1rem; min-height: 3.75rem; padding-top: 0.5rem; padding-bottom: 0.5rem; }
  .brand { font-family: var(--serif); font-weight: 500; font-size: 1.3rem; text-decoration: none; }
  .nav-right { display: flex; align-items: center; gap: 1.5rem; }
  .menu { display: flex; gap: 1.5rem; margin: 0; padding: 0; list-style: none; }
  .menu a { color: var(--muted); text-decoration: none; font-size: 0.95rem; }
  .menu a:hover { color: var(--ink); text-decoration: underline; }
  .theme { display: grid; place-items: center; width: 2.25rem; height: 2.25rem; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--ink); cursor: pointer; flex: none; }
  .theme:hover { border-color: var(--ink); }
  .theme svg { width: 1.05rem; height: 1.05rem; }
  @media (max-width: 560px) {
    .brand { display: none; }
    .topbar-inner { justify-content: center; }
    .nav-right { width: 100%; justify-content: space-between; gap: 0.6rem; }
    .menu { gap: 0.7rem; }
    .menu a { font-size: 0.85rem; }
  }

  .subhead { padding: 6.5rem 0 1rem; }
  .back-link { display: inline-block; margin-bottom: 1.5rem; color: var(--muted); text-decoration: none; font-size: 0.9rem; }
  .back-link:hover { color: var(--ink); text-decoration: underline; }
  #post-date { color: var(--muted); font-size: 0.9rem; }
  #post-title { margin: 0.5rem 0 0; font-family: var(--serif); font-weight: 400; font-size: clamp(2.25rem, 6vw, 3.25rem); line-height: 1.1; }

  /* Byline: author, date, share and socials, right under the title */
  .byline { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem 1.5rem; margin: 1.75rem 0 1.5rem; padding: 1rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .byline-author { display: flex; align-items: center; gap: 0.75rem; min-width: 0; flex-wrap: wrap; }
  .byline-avatar { width: 2.75rem; height: 2.75rem; border-radius: 50%; object-fit: cover; border: 1px solid var(--line); flex: none; }
  .byline-name { font-weight: 600; font-size: 0.95rem; }
  .byline .dot { color: var(--muted); }
  .byline #post-date { color: var(--muted); font-size: 0.95rem; }
  .byline-actions { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .share-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.45rem 1rem; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); font: inherit; font-size: 0.9rem; cursor: pointer; }
  .share-btn:hover { border-color: var(--ink); }
  .share-btn svg { width: 1rem; height: 1rem; }
  .byline .vr { width: 1px; height: 1.4rem; background: var(--line); }
  .byline-socials { display: flex; align-items: center; gap: 0.25rem; }
  .byline-socials a { display: grid; place-items: center; width: 2.1rem; height: 2.1rem; color: var(--muted); text-decoration: none; }
  .byline-socials a:hover { color: var(--ink); }
  .byline-socials svg { width: 1.15rem; height: 1.15rem; }
  @media (max-width: 560px) { .byline .vr { display: none; } }

  .post-body { padding-bottom: 2.5rem; }
  .byline-end { padding-bottom: 5rem; }
  .byline-end .byline { margin: 0; }
  .post-body p { margin: 0 0 1.3rem; }
  .post-body h2 { font-family: var(--serif); font-weight: 500; font-size: 1.8rem; margin: 2.2rem 0 1rem; }
  .post-body h3 { font-family: var(--serif); font-weight: 500; font-size: 1.4rem; margin: 1.8rem 0 0.8rem; }
  .post-body a { color: var(--ink); }
  .post-body ul, .post-body ol { margin: 0 0 1.3rem; padding-left: 1.4rem; }
  .post-body li { margin-bottom: 0.5rem; }
  .post-body blockquote { margin: 0 0 1.3rem; padding-left: 1rem; border-left: 2px solid var(--line); color: var(--muted); font-style: italic; }
  .post-body img { max-width: 100%; border-radius: 8px; }
  .post-not-found { color: var(--muted); }

  /* Keep reading: the latest other posts, shown after the one being read */
  .more { border-top: 1px solid var(--line); padding: 3rem 0 5rem; }
  .more h2 { margin: 0 0 1.75rem; font-family: var(--serif); font-weight: 400; font-size: clamp(1.8rem, 5vw, 2.4rem); line-height: 1.1; }
  .post-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1.25rem; }
  .post-card { display: flex; flex-direction: column; aspect-ratio: 1 / 1; padding: 1.5rem; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); }
  .post-card:hover { border-color: var(--ink); }
  .post-card time { color: var(--muted); font-size: 0.85rem; }

  .post-card .read-more { margin-top: auto; font-size: 0.85rem; text-decoration: underline; text-underline-offset: 0.25em; }

  footer { padding: 2rem 0 3rem; color: var(--muted); font-size: 0.9rem; border-top: 1px solid var(--line); }

    var btn = document.getElementById("theme");
    var moon = document.getElementById("icon-moon");
    var sun = document.getElementById("icon-sun");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function isDark() { var t = root.getAttribute("data-theme"); return t ? t === "dark" : mq.matches; }
    function paint() {
      var dark = isDark();
      moon.style.display = dark ? "none" : "";
      sun.style.display = dark ? "" : "none";
      btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    }
    btn.addEventListener("click", function () {
      var next = isDark() ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
      paint();
    });
    if (mq.addEventListener) mq.addEventListener("change", paint);
    paint();
  })();

  function slugify(s) {
    return (s || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "post";
  }
  function withSlugs(posts) {
    var seen = {};
    return posts.map(function (p) {
      var base = slugify(p.title);
      var slug = base, n = 2;
      while (seen[slug]) { slug = base + "-" + (n++); }
      seen[slug] = true;
      p.slug = slug;
      return p;
    });
  }

  // ---- Share: native share sheet where available, otherwise copy the link ----
  // One handler covers both bylines (under the title and at the end of the post).
  document.addEventListener("click", function (e) {
    var btn = e.target.closest(".share-btn");
    if (!btn) return;
    var label = btn.querySelector(".share-label");
    var url = window.location.href;
    var title = document.getElementById("post-title").textContent;
    function flash(text) {
      label.textContent = text;
      clearTimeout(btn._t);
      btn._t = setTimeout(function () { label.textContent = "Share"; }, 2000);
    }
    function copyLink() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { flash("Link copied"); },
          function () { window.prompt("Copy this link", url); });
      } else {
        window.prompt("Copy this link", url);
      }
    }
    if (navigator.share) {
      navigator.share({ title: title, url: url }).catch(function (err) {
        if (err && err.name !== "AbortError") copyLink(); // cancelled = do nothing
      });
    } else {
      copyLink();
    }
  });

  var params = new URLSearchParams(window.location.search);
  var wantedSlug = params.get("slug");

  fetch("content/posts.json").then(function (r) { return r.json(); }).then(function (data) {
    var posts = (data.posts || []).filter(function (p) { return p.status === "published"; });
    posts.sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
    posts = withSlugs(posts);
    var post = posts.find(function (p) { return p.slug === wantedSlug; });

    if (!post) {
      document.querySelector(".byline").style.display = "none";
      document.getElementById("post-title").textContent = "Post not found";
      document.getElementById("post-body").innerHTML = '<p class="post-not-found">This post may have been unpublished, or the link is out of date. <a href="writing.html">See all posts</a>.</p>';
      return;
    }

    document.getElementById("page-title").textContent = post.title + " — Lakshay Khichar";
    document.getElementById("post-title").textContent = post.title || "";
    var d = post.date ? new Date(post.date) : null;
    var timeEl = document.getElementById("post-date");
    if (!d) document.querySelector(".byline .dot").style.display = "none";
    if (d) {
      timeEl.setAttribute("datetime", post.date);
      timeEl.textContent = d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
    }
    // Same byline again once the write-up ends (copied so the links live in one place)
    var endCopy = document.querySelector(".byline").cloneNode(true);
    endCopy.querySelectorAll("[id]").forEach(function (el) { el.removeAttribute("id"); });
    document.getElementById("byline-end").appendChild(endCopy);

    var bodyEl = document.getElementById("post-body");
    if (window.marked && post.body) {
      bodyEl.innerHTML = marked.parse(post.body);
    } else if (post.excerpt) {
      bodyEl.innerHTML = "<p></p>";
      bodyEl.querySelector("p").textContent = post.excerpt;
    }

    // "Keep reading": the 3 latest other posts (posts is already newest first)
    var others = posts.filter(function (o) { return o.slug !== post.slug; }).slice(0, 3);
    if (others.length) {
      var moreGrid = document.getElementById("more-grid");
      others.forEach(function (p) {
        var a = document.createElement("a");
        a.className = "post-card";
        a.href = "post.html?slug=" + encodeURIComponent(p.slug);
        var pd = p.date ? new Date(p.date) : null;
        var dateHtml = pd ? '<time datetime="' + p.date + '">' + pd.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) + "</time>" : "";
        a.innerHTML = dateHtml + '<h3></h3><p></p><span class="read-more">Read post →</span>';
        a.querySelector("h3").textContent = p.title || "";
        a.querySelector("p").textContent = p.excerpt || "";
        moreGrid.appendChild(a);
      });
      document.getElementById("more").hidden = false;
    }
  }).catch(function () {
    document.querySelector(".byline").style.display = "none";
    document.getElementById("post-title").textContent = "Post not found";
    document.getElementById("post-body").innerHTML = '<p class="post-not-found">Couldn\'t load posts right now. <a href="writing.html">See all posts</a>.</p>';
  });
</script>
</body>
</html>
