## Decap CMS configuration for a Netlify-hosted site.
##
## Netlify provides its own login (Identity) and its own way of writing back to your
## GitHub repo (Git Gateway), so no separate GitHub OAuth App or proxy server is
## needed. Turn both on in the Netlify dashboard for this site:
##   Site configuration > Identity > Enable Identity
##   Identity > Registration: set to "Invite only"
##   Identity > Services > Git Gateway > Enable Git Gateway
## Then invite yourself: Identity tab > Invite users > your email.

backend:
  name: git-gateway
  branch: main

# Where images you upload from the admin panel are stored and served from.
media_folder: "content/images/uploads"
public_folder: "/content/images/uploads"

# The site reads content/posts.json and content/photos.json directly (see index.html),
# so both collections below are single-file "list" collections — no build step needed.
collections:
  - name: "posts"
    label: "Writing"
    files:
      - name: "posts"
        label: "All posts"
        file: "content/posts.json"
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            summary: "{{title}} — {{status}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime" }
              - { label: "Excerpt", name: "excerpt", widget: "text", hint: "One or two lines, shown in the list on the site." }
              - { label: "Body", name: "body", widget: "markdown", required: false }
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["draft", "published"]
                default: "draft"
                hint: "Stays hidden on the site until you set this to published."

  - name: "photos"
    label: "Photos"
    files:
      - name: "photos"
        label: "All photos"
        file: "content/photos.json"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{group}} — {{status}}"
            fields:
              - label: "Section"
                name: "group"
                widget: "select"
                options:
                  - { label: "Frames (surroundings, things you find interesting)", value: "frames" }
                  - { label: "Moments (photos of you)", value: "moments" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string", required: false }
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["draft", "published"]
                default: "draft"
                hint: "Stays hidden on the site until you set this to published."
